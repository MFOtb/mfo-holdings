<style>
:root{--ink:#1d1d1f;--soft:#86868b;--ease:cubic-bezier(.25,.1,.25,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{background:#fff;color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','IBM Plex Sans Arabic',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block;user-select:none;-webkit-user-drag:none}
a{color:inherit;text-decoration:none}

/* ---- wordmark ---- */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:30px 0;opacity:0;transition:opacity 1.6s var(--ease) .9s}
body.ready header{opacity:1}
.wm{font-size:12px;font-weight:600;letter-spacing:.5em;text-indent:.5em;color:var(--ink)}

/* ---- hero portrait ---- */
#hero{position:relative;min-height:80svh;display:flex;align-items:center;justify-content:center;padding:84px 20px 0}
.portrait{position:relative;width:min(560px,86vw);will-change:transform}
.portrait{opacity:0;transform:scale(1.045);transition:opacity 2.2s var(--ease) .25s,transform 2.6s var(--ease) .25s;
  -webkit-mask-image:radial-gradient(ellipse 78% 82% at 50% 42%,#000 55%,transparent 97%);
  mask-image:radial-gradient(ellipse 78% 82% at 50% 42%,#000 55%,transparent 97%)}
body.ready .portrait{opacity:1;transform:none}
.portrait img{width:100%}
.p-color{position:relative}
.p-bw{position:absolute;inset:0;--lx:-9999px;--ly:-9999px;--lr:1px;
  -webkit-mask-image:radial-gradient(circle var(--lr) at var(--lx) var(--ly),transparent 0 62%,#000 100%);
  mask-image:radial-gradient(circle var(--lr) at var(--lx) var(--ly),transparent 0 62%,#000 100%);
  cursor:crosshair}

/* ---- scroll cue ---- */
.hero-cue{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);opacity:0;animation:rise 1s var(--ease) 1.2s forwards;display:flex;flex-direction:column;align-items:center}
.hero-cue svg{width:36px;height:36px;display:block;animation:bobber 1.7s ease-in-out infinite}
.hero-cue svg+svg{margin-top:-24px;opacity:.3;animation-delay:.15s}
.hero-cue path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes bobber{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---- connecting line ---- */
.thread{display:flex;justify-content:center;padding:0 0 5vh}
.thread i{width:1px;height:88px;background:linear-gradient(var(--ink),transparent);transform:scaleY(0);transform-origin:top;transition:transform 1.6s var(--ease)}
.thread.in i{transform:scaleY(1)}

/* ---- naqsh ---- */
#naqsh{display:flex;justify-content:center;padding:0 22px 11vh}
#naqsh img{height:clamp(84px,11vw,124px);width:auto;filter:grayscale(1)}

/* ---- logos ---- */
#logos{max-width:1060px;margin:0 auto;padding:0 max(22px,4vw) 6vh}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{display:flex;align-items:center;justify-content:center;padding:clamp(34px,4.5vw,56px) clamp(18px,3vw,40px);border-radius:22px;transition:background .6s var(--ease),transform .6s var(--ease)}
.cell:hover{background:#f5f5f7;transform:translateY(-5px)}
.cell img{max-height:clamp(38px,4.6vw,58px);max-width:min(210px,72%);width:auto;object-fit:contain;filter:grayscale(1);opacity:.85;transition:opacity .5s,filter .7s var(--ease)}
.cell:hover img{opacity:1;filter:grayscale(0)}
.cell:nth-child(10){grid-column:2}
.cell .nasab-mark{max-height:clamp(46px,5.4vw,66px)}
@media(max-width:620px){.lgrid{grid-template-columns:repeat(2,1fr)}.cell:nth-child(10){grid-column:auto}}

/* ---- reveal ---- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.reveal.in{opacity:1;transform:none}

/* ---- footer ---- */
footer{padding:6vh 20px 56px;display:flex;flex-direction:column;align-items:center;gap:34px}
.icons{display:flex;gap:14px}
.ic{width:46px;height:46px;border:1px solid rgba(0,0,0,.16);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .4s var(--ease),border-color .4s,transform .4s var(--ease)}
.ic svg{width:17px;height:17px;fill:var(--ink);transition:fill .4s}
.ic:hover{background:var(--ink);border-color:var(--ink);transform:translateY(-3px)}
.ic:hover svg{fill:#fff}
.fwm{font-size:10px;font-weight:500;letter-spacing:.45em;text-indent:.45em;color:var(--soft)}
.credit{direction:ltr;font-size:10.5px;letter-spacing:.08em;color:#8e8e93}
.credit a{color:#6e6e73;transition:color .3s}
.credit a:hover{color:var(--ink)}

/* v2 fixes */

.cell img[alt="شيس"]{max-height:clamp(33px,4vw,50px)}
.cell img[alt="وشم"]{max-height:clamp(45px,5.4vw,67px)}

<script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
addEventListener("load",()=>document.body.classList.add("ready"));
setTimeout(()=>document.body.classList.add("ready"),1000);

/* ---- color lens ---- */
const pt=document.getElementById("pt"), pbw=document.getElementById("pbw");
let lx=-500,ly=-500,gx=-500,gy=-500,lr=0,gr=0,active=false;
function setLens(x,y,r){pbw.style.setProperty("--lx",x+"px");pbw.style.setProperty("--ly",y+"px");pbw.style.setProperty("--lr",r+"px");}
function toLocal(cx,cy){const b=pt.getBoundingClientRect();return [cx-b.left, cy-b.top];}
pt.addEventListener("mousemove",e=>{const [x,y]=toLocal(e.clientX,e.clientY);gx=x;gy=y;gr=Math.min(pt.offsetWidth*.30,190);active=true;});
pt.addEventListener("mouseleave",()=>{gr=0;active=false;});
pt.addEventListener("touchmove",e=>{const t=e.touches[0];const [x,y]=toLocal(t.clientX,t.clientY);gx=x;gy=y;gr=Math.min(pt.offsetWidth*.30,190);},{passive:true});
pt.addEventListener("touchend",()=>{gr=0;});
(function lensLoop(){
  lx+=(gx-lx)*.14; ly+=(gy-ly)*.14; lr+=(gr-lr)*.10;
  setLens(lx,ly,Math.max(1,lr)); requestAnimationFrame(lensLoop);
})();
/* intro sweep: the lens glides across the face once so the visitor discovers the magic */
setTimeout(()=>{
  if(active) return;
  if(!matchMedia("(hover:hover) and (pointer:fine)").matches) return; // no auto color on touch devices
  const w=pt.offsetWidth,h=pt.offsetHeight;
  const path=[[w*.32,h*.42],[w*.5,h*.38],[w*.66,h*.44],[w*.55,h*.62],[w*.42,h*.55]];
  let i=0;
  gx=path[0][0];gy=path[0][1];lx=gx;ly=gy;gr=Math.min(w*.30,190);
  const iv=setInterval(()=>{
    i++;
    if(i>=path.length||active){clearInterval(iv);if(!active)gr=0;return;}
    gx=path[i][0];gy=path[i][1];
  },650);
},2400);

/* reveals */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}
}),{threshold:.2});
document.querySelectorAll(".reveal,.thread").forEach(el=>io.observe(el));

/* staggered logo cells */
document.querySelectorAll(".cell").forEach((c,i)=>c.style.transitionDelay=(i%3*0.08+Math.floor(i/3)*0.05)+"s");
</script>
